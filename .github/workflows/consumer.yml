name: consumer
on:
  workflow_run:
    workflows: ["producer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: producer run id
        required: true
permissions:
  actions: read
  contents: read
env:
  RUNID: ${{ github.event.workflow_run.id || inputs.run_id }}
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "actor     : ${{ github.event.workflow_run.actor.login }}"
          echo "head repo : ${{ github.event.workflow_run.head_repository.full_name }}"
          echo "event     : ${{ github.event.workflow_run.event }}"
          echo "run id    : ${{ env.RUNID }}"
          rm -f /tmp/V0* /tmp/V1* 2>/dev/null || true
      - name: download v4
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: poc
          run-id: ${{ env.RUNID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./out_v4
      - name: check v4
        run: |
          echo "=== after v4 ==="
          for f in V01_plain V02_backslash V03_absolute V04_doubled V05_urlenc V06_prefixed V07_dotslash V08_deep V09_unc V10_symlink; do
            if [ -e "/tmp/$f" ]; then echo "ESCAPED /tmp/$f"; fi
          done
          if [ -e "$HOME/V01_plain" ]; then echo "ESCAPED HOME"; fi
          echo "--- contained under ./out_v4 ---"
          find ./out_v4 -maxdepth 4 2>/dev/null | head -20
          rm -f /tmp/V0* /tmp/V1* 2>/dev/null || true
      - name: download v4.1.8
        uses: actions/download-artifact@v4.1.8
        continue-on-error: true
