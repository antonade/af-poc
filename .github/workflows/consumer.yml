name: consumer
on:
  workflow_run:
    workflows: ["producer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: producer run id
        required: true
permissions:
  actions: read
  contents: read
env:
  RUNID: ${{ github.event.workflow_run.id || inputs.run_id }}
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "run id : ${{ env.RUNID }}"
          rm -f /tmp/V06_prefixed 2>/dev/null || true
      - name: dl v4.1.2
        uses: actions/download-artifact@v4.1.2
        continue-on-error: true
        with:
          name: poc
          run-id: ${{ env.RUNID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ./o_v4_1_2
      - name: verdict v4.1.2
        run: |
          if [ -f ./o_v4_1_2/benign.txt ]; then CTRL=OK; else CTRL=DOWNLOAD_FAILED; fi
          if [ -e /tmp/V06_prefixed ]; then ESC=ESCAPED; else ESC=contained; fi
          echo "RESULT v4.1.2 control=$CTRL verdict=$ESC"
          rm -f /tmp/V06_prefixed 2>/dev/null || true
      - name: dl v4.1.3
